<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/analytics.js" defer></script>
    <script src="/js/nav.js?v=98" defer></script>
    <meta charset="UTF-8">
    <title>Review Queue - VCDekho</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .editor { display: none; background: #fafafa; padding: 20px; border: 1px solid #ccc; margin-top: 20px; }
        .editor.active { display: block; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        textarea { height: 300px; font-family: monospace; }
        button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        .actions { margin-top: 15px; }
    </style>
</head>
<body>
    <h1>News Review Queue</h1>
    <table id="draftsTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Source</th>
                <th>Generated</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="editor" class="editor">
        <h2>Edit Article</h2>
        <input type="hidden" id="editId">
        <label>Title</label>
        <input type="text" id="editTitle">
        <label>Slug</label>
        <input type="text" id="editSlug">
        <label>Meta Title</label>
        <input type="text" id="editMetaTitle">
        <label>Meta Description</label>
        <input type="text" id="editMetaDescription">
        <label>Tags (comma separated)</label>
        <input type="text" id="editTags">
        <label>Body (HTML allowed)</label>
        <textarea id="editBody"></textarea>
        <div class="actions">
            <button onclick="approveArticle()" style="background: #28a745; color: white; border: none;">Approve & Publish</button>
            <button onclick="discardArticle()" style="background: #dc3545; color: white; border: none;">Discard</button>
            <button onclick="closeEditor()">Cancel</button>
        </div>
    </div>

    <script>
        const secret = prompt("Enter ADMIN_SECRET:");
        let drafts = [];

        async function fetchDrafts() {
            const res = await fetch('/api/admin/articles', {
                headers: { 'Authorization': `Bearer ${secret}` }
            });
            if (!res.ok) return alert('Unauthorized or API error');
            drafts = await res.json();
            renderTable();
        }

        function renderTable() {
            const tbody = document.querySelector('#draftsTable tbody');
            tbody.innerHTML = '';
            drafts.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.title}</td>
                    <td>${d.source_name}</td>
                    <td>${new Date(d.created_at).toLocaleString()}</td>
                    <td><button onclick="openEditor('${d.id}')">Review</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openEditor(id) {
            const d = drafts.find(x => x.id === id);
            document.getElementById('editId').value = d.id;
            document.getElementById('editTitle').value = d.title;
            document.getElementById('editSlug').value = d.slug;
            document.getElementById('editMetaTitle').value = d.meta_title;
            document.getElementById('editMetaDescription').value = d.meta_description;
            document.getElementById('editTags').value = (d.tags || []).join(', ');
            document.getElementById('editBody').value = d.body;
            document.getElementById('editor').classList.add('active');
        }

        function closeEditor() {
            document.getElementById('editor').classList.remove('active');
        }

        async function processAction(action) {
            const id = document.getElementById('editId').value;
            const payload = {
                id,
                action,
                title: document.getElementById('editTitle').value,
                slug: document.getElementById('editSlug').value,
                meta_title: document.getElementById('editMetaTitle').value,
                meta_description: document.getElementById('editMetaDescription').value,
                tags: document.getElementById('editTags').value.split(',').map(t => t.trim()),
                body: document.getElementById('editBody').value
            };
            
            const btn = document.querySelector('button');
            btn.disabled = true;
            
            const res = await fetch('/api/admin/articles', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${secret}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                alert('Success');
                closeEditor();
                fetchDrafts();
            } else {
                alert('Error processing action');
            }
        }

        function approveArticle() { processAction('approve'); }
        function discardArticle() { processAction('discard'); }

        fetchDrafts();
    </script>
</body>
</html>
