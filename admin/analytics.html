<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>User Analytics · VC Dekho Admin</title>
  <link rel="icon" type="image/png" href="/assets/logoforvc.png">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.9);
      --muted: rgba(255,255,255,0.55);
      --ok: #3ecf8e;
      --bad: #ff6b6b;
      --accent: #ED572F;
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 1.5rem; line-height: 1.45; }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; font-weight: 650; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.92rem; }
    .top { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .links a { color: #ffb89c; text-decoration: none; margin-right: 1rem; font-size: 0.9rem; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.05rem; }
    .card .label { color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .card .value { font-size: 1.55rem; font-weight: 650; margin-top: 0.25rem; }
    .card .meta { font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; }
    .delta.up { color: var(--ok); }
    .delta.down { color: var(--bad); }
    .panel { margin-bottom: 1.25rem; }
    .panel h2 { font-size: 1.05rem; margin: 0 0 0.65rem; font-weight: 650; }
    button, .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 0.65rem 1rem; font-weight: 650; cursor: pointer; font-size: 0.88rem; text-decoration: none; display: inline-block;
    }
    button.secondary, .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .funnel { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: stretch; }
    .funnel-step { flex: 1; min-width: 140px; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); }
    .funnel-step strong { display: block; font-size: 1.4rem; margin-top: 0.25rem; }
    .funnel-arrow { align-self: center; color: var(--muted); font-size: 1.2rem; }
    .chart { display: flex; align-items: flex-end; gap: 0.35rem; height: 120px; padding-top: 0.5rem; }
    .bar-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; max-width: 28px; background: linear-gradient(180deg, #ff7a4d, var(--accent)); border-radius: 6px 6px 2px 2px; min-height: 4px; }
    .bar-label { font-size: 0.62rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .split { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.35rem; }
    .split span { font-size: 0.78rem; padding: 0.2rem 0.5rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    #msg { margin: 0.5rem 0 1rem; font-size: 0.9rem; }
    #msg.err { color: var(--bad); }
    .note { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>User analytics</h1>
      <p class="sub">Registrations, active users, and email unlock funnel.</p>
    </div>
    <div class="links">
      <a href="/admin/users.html">All users →</a>
      <a href="/admin/">Ops →</a>
      <a href="/">Site →</a>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="btn-refresh">Refresh</button>
    <a class="btn" href="/admin/users.html">View user table</a>
  </div>
  <p id="msg" hidden></p>
  <p class="note" id="sync-note"></p>

  <div class="grid" id="reg-grid"></div>

  <div class="grid" id="active-grid"></div>

  <div class="panel card">
    <h2>Unlock funnel</h2>
    <div class="funnel" id="funnel"></div>
  </div>

  <div class="panel card">
    <h2>Daily active users (14 days, IST)</h2>
    <div class="chart" id="dau-chart"></div>
  </div>

  <div class="panel card">
    <h2>Weekly active users (8 weeks)</h2>
    <div class="chart" id="wau-chart"></div>
  </div>

  <div class="panel card">
    <h2>Monthly active users (6 months)</h2>
    <div class="chart" id="mau-chart"></div>
  </div>

  <script>
    const SECRET_KEY = 'vd_admin_secret';
    let secret = sessionStorage.getItem(SECRET_KEY) || '';
    if (!secret) {
      secret = prompt('Enter ADMIN_SECRET:') || '';
      if (secret) sessionStorage.setItem(SECRET_KEY, secret);
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString('en-IN');
    }

    function deltaHtml(pct) {
      if (pct == null || isNaN(pct)) return '';
      const cls = pct >= 0 ? 'up' : 'down';
      const sign = pct >= 0 ? '+' : '';
      return '<span class="delta ' + cls + '">' + sign + pct + '% vs prior period</span>';
    }

    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      if (!text) { el.hidden = true; return; }
      el.hidden = false;
      el.textContent = text;
      el.className = ok ? '' : 'err';
    }

    function renderBars(containerId, series, labelKey) {
      const el = document.getElementById(containerId);
      if (!series || !series.length) {
        el.innerHTML = '<p style="color:var(--muted);font-size:0.88rem">No activity recorded yet</p>';
        return;
      }
      const max = Math.max.apply(null, series.map(function (s) { return s.active || 0; })) || 1;
      el.innerHTML = series.map(function (s) {
        const h = Math.max(4, Math.round(((s.active || 0) / max) * 100));
        const raw = s[labelKey] || '';
        const label = raw.length > 10 ? raw.slice(5) : raw;
        return '<div class="bar-wrap"><div class="bar" style="height:' + h + '%" title="' + raw + ': ' + (s.active || 0) + '"></div><span class="bar-label">' + label + '</span></div>';
      }).join('');
    }

    async function load() {
      setMsg('');
      const res = await fetch('/api/ops?action=analytics&view=overview', {
        headers: { Authorization: 'Bearer ' + secret }
      });
      if (res.status === 401) {
        sessionStorage.removeItem(SECRET_KEY);
        setMsg('Unauthorized — reload and enter ADMIN_SECRET again.', false);
        return;
      }
      if (!res.ok) {
        setMsg('Failed to load analytics (' + res.status + ')', false);
        return;
      }
      const data = await res.json();
      const reg = data.registered || {};

      document.getElementById('sync-note').textContent = data.supabaseSyncConfigured
        ? 'User list syncs from Supabase Auth every ~15 min when service role key is set.'
        : 'Add SUPABASE_SERVICE_ROLE_KEY in Vercel to sync all registered users from Supabase Auth. Activity is tracked from directory usage.';

      document.getElementById('reg-grid').innerHTML = [
        ['Registered users', reg.total, ''],
        ['Mobile (mweb)', reg.mweb, 'signup platform'],
        ['Desktop (dweb)', reg.dweb, 'signup platform'],
        ['Platform unknown', reg.unknown, 'legacy / not captured yet']
      ].map(function (row) {
        return '<div class="card"><div class="label">' + row[0] + '</div><div class="value">' + fmt(row[1]) +
          '</div>' + (row[2] ? '<div class="meta">' + row[2] + '</div>' : '') + '</div>';
      }).join('') +
        '<div class="card"><div class="label">Total unlocks</div><div class="value">' + fmt(data.unlocks && data.unlocks.totalUnlocks) +
        '</div><div class="meta">All time</div></div>';

      const d = data.dau || {};
      const w = data.wau || {};
      const m = data.mau || {};

      document.getElementById('active-grid').innerHTML = [
        ['DAU (today)', d.today, d.changePct, 'vs yesterday'],
        ['WAU (7 days)', w.thisWeek, w.changePct, 'vs prior 7 days'],
        ['MAU (30 days)', m.thisMonth, m.changePct, 'vs prior 30 days']
      ].map(function (row) {
        return '<div class="card"><div class="label">' + row[0] + '</div><div class="value">' + fmt(row[1]) +
          '</div><div class="meta">' + deltaHtml(row[2]) + '<br>' + row[3] + '</div></div>';
      }).join('');

      const f = data.funnel || {};
      document.getElementById('funnel').innerHTML =
        '<div class="funnel-step"><span class="label">Registered</span><strong>' + fmt(f.registered) + '</strong></div>' +
        '<div class="funnel-arrow">→</div>' +
        '<div class="funnel-step"><span class="label">Unlocked ≥1 email</span><strong>' + fmt(f.unlockedAtLeastOne) + '</strong></div>' +
        '<div class="funnel-step"><span class="label">Conversion</span><strong>' + (f.conversionPct || 0) + '%</strong></div>';

      renderBars('dau-chart', d.series, 'date');
      renderBars('wau-chart', w.series, 'week_start');
      renderBars('mau-chart', m.series, 'month_start');
    }

    document.getElementById('btn-refresh').addEventListener('click', function () {
      load().catch(function (e) { setMsg(e.message, false); });
    });

    load().catch(function (e) { setMsg(e.message, false); });
  </script>
</body>
</html>
