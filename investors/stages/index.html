<!DOCTYPE html>
<html lang="en" class="scrollable-page">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BJ23KLLWFM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BJ23KLLWFM');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Investment Stages | Pre-Seed to Growth | VC Dekho</title>
  <meta name="description" content="Deep guides to Pre-Seed, Seed, Pre-Series A, Series A, Series B and Series C+ / Growth — with investor lists for Indian founders.">
  <link rel="canonical" href="https://vcdekho.com/investors/stages">
  <link rel="icon" type="image/png" href="/assets/logoforvc.png">
  <link rel="stylesheet" href="/style.css?v=10">
</head>
<body class="scrollable-page inv-page">
  <div class="app-container">
    <header class="site-header">
      <a href="/" class="logo-container">
        <img src="/assets/logoforvc.png" alt="VC Dekho Logo" class="logo-img">
      </a>
      <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="navigation-bar">
        <a href="/" class="nav-link">Home</a>
        <a href="/investors" class="nav-link active">Investors</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="/news" class="nav-link">News</a>
      </nav>
    </header>

    <main class="hero-showcase inv-list-main">
      <div class="ambient-bg-wrapper">
        <div class="waitlist-bg">
          <div class="glow-orb orb-1"></div>
          <div class="glow-orb orb-2"></div>
          <div class="glow-orb orb-3"></div>
        </div>
      </div>

      <div class="inv-list-wrap">
        <div class="inv-breadcrumbs">
          <a href="/">Home</a><span>›</span>
          <a href="/investors">Investors</a><span>›</span>
          <span class="current">Stages</span>
        </div>

        <header class="inv-list-header">
          <span class="inv-kicker">Founder guides</span>
          <h1>Investment stages</h1>
          <p>A practical ladder from Pre-Seed to Growth — what each stage means in India, what investors look for, and which funds on VC Dekho map to it.</p>
        </header>

        <div id="stages-ladder" class="stages-index-ladder" aria-hidden="true"></div>
        <div id="stages-grid" class="stages-index-grid">
          <p class="inv-empty">Loading stages...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById('stages-grid');
      const ladder = document.getElementById('stages-ladder');
      try {
        const res = await fetch('/api/investors/list?view=stages');
        const data = await res.json();
        const stages = data.stages || [];
        if (!stages.length) {
          grid.innerHTML = '<p class="inv-empty">No stages found.</p>';
          return;
        }
        ladder.innerHTML = stages.map(s => `
          <a class="stage-ladder-step" href="/investors/stages/${encodeURIComponent(s.id)}">
            <span class="stage-ladder-num">${s.order}</span>
            <span class="stage-ladder-label">${s.label}</span>
          </a>
        `).join('');
        grid.innerHTML = stages.map(s => `
          <a class="stage-index-card" href="/investors/stages/${encodeURIComponent(s.id)}">
            <div class="stage-index-top">
              <span class="stage-index-order">Stage ${s.order}</span>
              <span class="stage-index-count">${s.investorCount} investors</span>
            </div>
            <h2>${s.label}</h2>
            <p>${s.summary}</p>
            <div class="stage-index-meta">
              <span>${(s.snapshot && s.snapshot.maturity) || ''}</span>
              <span class="stage-index-cta">Read guide →</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p class="inv-empty">Failed to load stages.</p>';
      }
    })();
  </script>
</body>
</html>
