<!DOCTYPE html>
<html lang="en" class="scrollable-page">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BJ23KLLWFM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BJ23KLLWFM');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Thesis Themes | VC Dekho</title>
  <meta name="description" content="Explore investment thesis themes used by Indian VCs, family offices and angels — then find matching investors on VC Dekho.">
  <link rel="canonical" href="https://vcdekho.com/investors/themes">
  <link rel="icon" type="image/png" href="/assets/logoforvc.png">
  <link rel="stylesheet" href="/style.css?v=35">
  <meta name="robots" content="index, follow">
</head>
<body class="scrollable-page inv-page">
  <div class="app-container">
    <header class="site-header">
      <a href="/" class="logo-container">
        <img src="/assets/logoforvc.png" alt="VC Dekho Logo" class="logo-img">
      </a>
      <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="navigation-bar">
        <a href="/" class="nav-link">Home</a>
        <a href="/investors" class="nav-link active">Investors</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="/news" class="nav-link">News</a>
        <a href="/login" class="nav-link" id="logout-link">Log in</a>
      </nav>
    </header>

    <main class="hero-showcase inv-list-main">
      <div class="ambient-bg-wrapper">
        <div class="waitlist-bg">
          <div class="glow-orb orb-1"></div>
          <div class="glow-orb orb-2"></div>
          <div class="glow-orb orb-3"></div>
        </div>
      </div>

      <div class="inv-list-wrap">
        <div class="inv-breadcrumbs">
          <a href="/">Home</a><span>›</span>
          <a href="/investors">Investors</a><span>›</span>
          <span class="current">Thesis themes</span>
        </div>

        <header class="inv-list-header">
          <span class="inv-kicker">Founder guides</span>
          <h1>Investment thesis themes</h1>
          <p>Each theme explains how a type of investor thinks — and which funds on VC Dekho map to it. Pair with <a class="inv-inline-link" href="/investors/stages">stage guides</a> before you shortlist.</p>
        </header>

        <div id="themes-grid" class="themes-grid">
          <p class="inv-empty">Loading themes...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/app.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById('themes-grid');
      try {
        const res = await fetch('/api/investors/list?view=themes');
        if (!res.ok) throw new Error('Failed to load themes');
        const data = await res.json();
        const themes = data.themes || [];
        if (!themes.length) {
          grid.innerHTML = '<p class="inv-empty">No themes found.</p>';
          return;
        }
        grid.innerHTML = themes.map(t => `
          <a class="theme-index-card" href="/investors/themes/${encodeURIComponent(t.id)}">
            <div class="theme-index-count">${t.investorCount} investors</div>
            <h2>${t.label}</h2>
            <p>${t.summary}</p>
            <span class="theme-index-cta">Read thesis →</span>
          </a>
        `).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p class="inv-empty">Failed to load themes.</p>';
      }
    })();
  </script>
</body>
</html>
