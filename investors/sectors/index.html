<!DOCTYPE html>
<html lang="en" class="scrollable-page">
<head>
      <script src="/js/analytics.js?v=2" defer></script>
    <script src="/js/nav.js?v=101" defer></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
  <title>Fund Sector Guides | Fintech, SaaS, AI & More | VC Dekho</title>
  <meta name="description" content="Sector guides for Indian founders — fintech, SaaS, consumer, AI, healthcare, deep tech, climate, and impact — with matching funds on VC Dekho.">
  <link rel="canonical" href="https://vcdekho.com/investors/sectors">
  <link rel="icon" type="image/png" href="/assets/logoforvc.png">
    <link rel="stylesheet" href="/css/base.css?v=101">
    <link rel="stylesheet" href="/css/hero.css?v=73">
    <link rel="stylesheet" href="/css/ambient.css?v=98">
    <link rel="stylesheet" href="/css/directory.css?v=73">
<meta name="robots" content="index, follow">
</head>
<body class="scrollable-page inv-page stage-guide-page">
  <div class="app-container">
    <header class="site-header">
      <a href="/" class="logo-container">
        <img src="/assets/logoforvc.png" alt="VC Dekho Logo" class="logo-img">
      </a>
      <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="navigation-bar">
        <a href="/" class="nav-link">Home</a>
        <a href="/investors" class="nav-link active">Funds</a>
        <a href="/people" class="nav-link">Investors</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="/news" class="nav-link">News</a>
      </nav>
    </header>

    <main class="hero-showcase inv-list-main">
      <div class="ambient-bg-wrapper">
        <div class="waitlist-bg">
          <div class="glow-orb orb-1"></div>
          <div class="glow-orb orb-2"></div>
          <div class="glow-orb orb-3"></div>
        </div>
      </div>

      <div class="inv-list-wrap stage-page-wrap">
        <div class="inv-breadcrumbs">
          <a href="/">Home</a><span>›</span>
          <a href="/investors">Funds</a><span>›</span>
          <span class="current">Sectors</span>
        </div>

        <section class="stage-hero stage-hero-enter stages-index-hero" id="overview">
          <div class="stage-hero-wash" aria-hidden="true"></div>
          <div class="stage-hero-num" aria-hidden="true">08</div>
          <div class="stage-hero-copy">
            <span class="stage-hero-kicker">Founder guides</span>
            <h1 class="stage-hero-title">Sector guides</h1>
            <p class="stage-hero-summary">Deep playbooks for India’s densest fundraising categories — landscape, metrics, diligence weights, and matching funds. Pair with <a class="inv-inline-link" href="/investors/stages">stage</a> and <a class="inv-inline-link" href="/investors/themes">thesis</a> guides.</p>
            <div class="stage-hero-actions">
              <div class="stage-hero-stat"><strong>8</strong><span>sector guides</span></div>
              <a class="stage-hero-cta" href="/investors">Browse funds</a>
            </div>
          </div>
        </section>

        <div id="sectors-grid" class="stages-index-grid">
          <p class="inv-empty">Loading sectors...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js" defer></script>
  <script src="/app.js" defer></script>
  <script>
    (async function () {
      const grid = document.getElementById('sectors-grid');
      try {
        const res = await fetch('/api/investors/list?view=sectors');
        if (!res.ok) throw new Error('Failed to load sectors');
        const data = await res.json();
        const sectors = data.sectors || [];
        if (!sectors.length) {
          grid.innerHTML = '<p class="inv-empty">No sector guides found.</p>';
          return;
        }
        grid.innerHTML = sectors.map((s, i) => `
          <a class="stage-index-card stage-reveal is-visible" href="/investors/sectors/${encodeURIComponent(s.id)}">
            <div class="stage-index-top">
              <span class="stage-index-order">${s.iconSvg || ''} Guide ${String(i + 1).padStart(2, '0')}</span>
              <span class="stage-index-count">${s.investorCount} funds</span>
            </div>
            <h2>${s.label}</h2>
            <p>${s.summary}</p>
            <div class="stage-index-meta">
              <span>${(s.snapshot && s.snapshot.diligenceFocus) || ''}</span>
              <span class="stage-index-cta">Open guide →</span>
            </div>
          </a>
        `).join('');
        requestAnimationFrame(() => document.body.classList.add('stage-ready'));
      } catch (err) {
        grid.innerHTML = '<p class="inv-empty">Could not load sector guides.</p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
