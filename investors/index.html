  <meta charset="UTF-8">

  <title>Indian Investors Directory | VC Dekho</title>
  <meta name="description" content="Explore 380+ VCs, family offices, angels and syndicates in India. Filter by sector, stage, cheque size, company type and investment thesis.">

  <link rel="icon" type="image/png" href="/assets/logoforvc.png">
  <link rel="stylesheet" href="/style.css?v=17">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Indian Investors Directory | VC Dekho">
  <meta property="og:description" content="Explore 380+ VCs, family offices, angels and syndicates in India.">
  <meta property="og:url" content="https://vcdekho.com/investors">
</head>
<body class="scrollable-page inv-page inv-dir-page">
  <div class="app-container">
    <header class="site-header">
      <a href="/" class="logo-container">
        <img src="/assets/logoforvc.png" alt="VC Dekho Logo" class="logo-img">
      </a>
      <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="navigation-bar">
        <a href="/" class="nav-link">Home</a>
        <a href="/investors" class="nav-link active">Investors</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="/news" class="nav-link">News</a>
        <a href="/login" class="nav-link" id="logout-link">Log out</a>
      </nav>
    </header>

    <main class="hero-showcase inv-list-main">
      <div class="ambient-bg-wrapper inv-dir-ambient" aria-hidden="true">
        <div class="waitlist-bg">
          <div class="glow-orb orb-1"></div>
          <div class="glow-orb orb-2"></div>
        </div>
      </div>

      <div class="inv-dir-wrap">
        <header class="inv-dir-header">
          <div class="inv-dir-header-text">
            <h1>Investors</h1>
            <p class="inv-dir-meta">
              <span id="inv-count">Loading…</span>
              <span class="inv-dir-dot" aria-hidden="true">·</span>
              <a href="/investors/themes">Thesis guides</a>
              <span class="inv-dir-dot" aria-hidden="true">·</span>
              <a href="/investors/stages">Stage guides</a>
            </p>
          </div>
          <button type="button" class="inv-dir-filters-toggle" id="inv-filters-toggle" aria-expanded="false" aria-controls="inv-dir-sidebar">
            Filters
          </button>
        </header>

        <div class="inv-dir-layout">
          <aside class="inv-dir-sidebar" id="inv-dir-sidebar">
            <div class="inv-dir-sidebar-head">
              <span>Filters</span>
              <button type="button" class="inv-dir-sidebar-close" id="inv-filters-close" aria-label="Close filters">Close</button>
            </div>

            <label class="inv-dir-field">
              <span>Search</span>
              <input id="inv-search" type="search" placeholder="Fund, thesis, sector…" autocomplete="off">
            </label>

            <label class="inv-dir-field">
              <span>Sector</span>
              <select id="filter-sector"><option value="">All sectors</option></select>
            </label>
            <label class="inv-dir-field">
              <span>Stage</span>
              <select id="filter-stage"><option value="">All stages</option></select>
            </label>
            <label class="inv-dir-field">
              <span>Ticket size</span>
              <select id="filter-cheque"><option value="">Any ticket</option></select>
            </label>
            <label class="inv-dir-field">
              <span>Company type</span>
              <select id="filter-type"><option value="">All types</option></select>
            </label>
            <label class="inv-dir-field">
              <span>Investment thesis</span>
              <select id="filter-thesis"><option value="">All theses</option></select>
            </label>

            <button type="button" id="inv-clear" class="inv-dir-clear">Clear filters</button>
          </aside>

          <div class="inv-dir-main">
            <div class="inv-dir-table-head" aria-hidden="true">
              <span>Fund</span>
              <span>Stages</span>
              <span>Sectors / Thesis</span>
              <span>Ticket</span>
            </div>
            <div id="inv-results" class="inv-dir-results"></div>
            <div class="inv-dir-pager">
              <button type="button" id="inv-prev" disabled>Previous</button>
              <span id="inv-page-label"></span>
              <button type="button" id="inv-next" disabled>Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="inv-dir-backdrop" id="inv-filters-backdrop" hidden></div>

  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/app.js"></script>
  <script src="/investors/investors.js"></script>
</body>
</html>
