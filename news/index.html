    <link rel="preload" href="/assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="/css/hero.css?v=73">
    <link rel="stylesheet" href="/css/ambient.css?v=98">
    <link rel="stylesheet" href="/css/blog.css?v=75">
</head>
<body class="scrollable-page pub-page">
    <div class="app-container">
        <header class="site-header">
            <a href="/" class="logo-container">
                <img src="/assets/logoforvc.png" alt="VC Dekho Logo" class="logo-img" width="220" height="204">
            </a>
            <button class="nav-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="main-nav" id="navigation-bar">
                <a href="/" class="nav-link">Home</a>
                <a href="/investors" class="nav-link">Investors</a>
                <a href="/funds" class="nav-link">Funds</a>
                <a href="/buzz" class="nav-link">Founder Buzz</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/news" class="nav-link active">News</a>
                <a href="/login" class="nav-link" id="nav-auth-link">Log in</a>
            </nav>
        </header>

        <main class="hero-showcase">
            <!-- Ambient Glow Background -->
            <div class="ambient-bg-wrapper">
                <div class="waitlist-bg" id="waitlist-ambient-bg">
                    <div class="glow-orb orb-1"></div>
                    <div class="glow-orb orb-2"></div>
                    <div class="glow-orb orb-3"></div>
                </div>
            </div>
            
            <div class="blog-content news-page-content">
                <!-- Breadcrumbs -->
                <div class="news-breadcrumbs">
                    <a href="/" style="color: var(--color-text-muted); text-decoration: none;">Home</a> 
                    <span style="margin: 0 8px;">›</span> 
                    <span style="color: var(--color-accent-orange);">News</span>
                </div>

                <h1 class="blog-title">Latest VC News</h1>
                <p class="news-page-lead">Daily funding rounds, VC firm updates, and startup news from across India's vibrant ecosystem.</p>

                <div id="news-container" aria-busy="true">
                    <div class="news-feed-card featured-news-card news-skel-card" aria-hidden="true">
                        <div class="news-content" style="padding: 35px;">
                            <div class="news-meta">
                                <span class="blog-skel-line blog-skel-cat"></span>
                                <span class="blog-skel-line blog-skel-meta"></span>
                            </div>
                            <span class="blog-skel-line blog-skel-title" style="height: 1.6rem; width: 88%; margin-bottom: 0.55rem;"></span>
                            <span class="blog-skel-line blog-skel-title short" style="height: 1.6rem; width: 62%; margin-bottom: 1rem;"></span>
                            <span class="blog-skel-line blog-skel-excerpt"></span>
                            <span class="blog-skel-line blog-skel-excerpt" style="margin-top: 0.45rem;"></span>
                            <span class="blog-skel-line blog-skel-excerpt short" style="margin-top: 0.45rem;"></span>
                        </div>
                    </div>
                    <div class="news-grid">
                        <div class="news-feed-card grid-news-card news-skel-card" aria-hidden="true">
                            <div class="news-content" style="padding: 25px;">
                                <span class="blog-skel-line blog-skel-cat" style="margin-bottom: 12px;"></span>
                                <span class="blog-skel-line blog-skel-title" style="height: 1.15rem; width: 95%;"></span>
                                <span class="blog-skel-line blog-skel-title short" style="height: 1.15rem; width: 70%; margin-top: 0.45rem;"></span>
                                <span class="blog-skel-line blog-skel-meta" style="margin-top: 1.25rem;"></span>
                            </div>
                        </div>
                        <div class="news-feed-card grid-news-card news-skel-card" aria-hidden="true">
                            <div class="news-content" style="padding: 25px;">
                                <span class="blog-skel-line blog-skel-cat" style="margin-bottom: 12px;"></span>
                                <span class="blog-skel-line blog-skel-title" style="height: 1.15rem; width: 92%;"></span>
                                <span class="blog-skel-line blog-skel-title short" style="height: 1.15rem; width: 64%; margin-top: 0.45rem;"></span>
                                <span class="blog-skel-line blog-skel-meta" style="margin-top: 1.25rem;"></span>
                            </div>
                        </div>
                        <div class="news-feed-card grid-news-card news-skel-card" aria-hidden="true">
                            <div class="news-content" style="padding: 25px;">
                                <span class="blog-skel-line blog-skel-cat" style="margin-bottom: 12px;"></span>
                                <span class="blog-skel-line blog-skel-title" style="height: 1.15rem; width: 90%;"></span>
                                <span class="blog-skel-line blog-skel-title short" style="height: 1.15rem; width: 58%; margin-top: 0.45rem;"></span>
                                <span class="blog-skel-line blog-skel-meta" style="margin-top: 1.25rem;"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="pub-load-more" id="news-load-more" hidden>Load more</button>
            </div>
        </main>
    </div>

        <script src="/js/auth.js?v=2" defer></script>
    <script src="/js/directory-session.js?v=3" defer></script>
<script src="/app.js" defer></script>
    <script>
        (function () {
            var PAGE = 8;
            var offset = 0;
            var container = document.getElementById('news-container');
            var moreBtn = document.getElementById('news-load-more');

            function esc(s) {
                return String(s || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function cardHtml(a, featured) {
                var dateStr = new Date(a.published_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' });
                var catStr = a.category === 'funding-round' ? 'Funding Round' : String(a.category || '').replace('-', ' ');
                var img = a.image_url ? '<div class="news-image"><img src="' + esc(a.image_url) + '" alt="' + esc(a.title) + '"></div>' : '';
                if (featured) {
                    return '<a href="/news/' + esc(a.slug) + '" class="news-feed-card featured-news-card">' +
                        img +
                        '<div class="news-content">' +
                        '<div class="news-meta"><span class="news-category">' + esc(catStr) + '</span>' +
                        '<span class="news-date-source">' + dateStr + ' • ' + esc(a.source_name) + '</span></div>' +
                        '<h2 class="news-title" style="font-size: 2.2rem;">' + esc(a.title) + '</h2>' +
                        (a.meta_description ? '<p class="news-desc" style="color: var(--color-text-muted); margin-top: 15px; font-size: 1.1rem; line-height: 1.6;">' + esc(a.meta_description) + '</p>' : '') +
                        '</div></a>';
                }
                return '<a href="/news/' + esc(a.slug) + '" class="news-feed-card grid-news-card">' +
                    img +
                    '<div class="news-content" style="padding: 25px;">' +
                    '<div class="news-meta" style="margin-bottom: 10px;"><span class="news-category">' + esc(catStr) + '</span></div>' +
                    '<h2 class="news-title" style="font-size: 1.3rem; margin-bottom: 15px;">' + esc(a.title) + '</h2>' +
                    '<div class="news-date-source" style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);">' + dateStr + ' • ' + esc(a.source_name) + '</div>' +
                    '</div></a>';
            }

            async function fetchNews() {
                if (!container) return;
                try {
                    var res = await fetch('/api/news/list?limit=' + PAGE + '&offset=' + offset);
                    var articles = await res.json();
                    if (!Array.isArray(articles) || articles.length === 0) {
                        if (!offset) {
                            container.innerHTML = '<p style="color: var(--color-text-muted);">No news published yet.</p>';
                        }
                        container.setAttribute('aria-busy', 'false');
                        if (moreBtn) moreBtn.hidden = true;
                        return;
                    }
                    if (!offset) {
                        var html = cardHtml(articles[0], true);
                        var rest = articles.slice(1).map(function (a) { return cardHtml(a, false); }).join('');
                        html += '<div class="news-grid" id="news-grid">' + rest + '</div>';
                        container.innerHTML = html;
                    } else {
                        var grid = document.getElementById('news-grid');
                        if (!grid) {
                            grid = document.createElement('div');
                            grid.className = 'news-grid';
                            grid.id = 'news-grid';
                            container.appendChild(grid);
                        }
                        grid.insertAdjacentHTML('beforeend', articles.map(function (a) { return cardHtml(a, false); }).join(''));
                    }
                    offset += articles.length;
                    container.setAttribute('aria-busy', 'false');
                    if (moreBtn) moreBtn.hidden = articles.length < PAGE;
                } catch (err) {
                    console.error(err);
                    if (!offset) container.innerHTML = '<p style="color: #ff6b6b;">Failed to load news.</p>';
                    container.setAttribute('aria-busy', 'false');
                }
            }

            if (moreBtn) {
                moreBtn.addEventListener('click', function () {
                    moreBtn.disabled = true;
                    fetchNews().finally(function () { moreBtn.disabled = false; });
                });
            }
            fetchNews();
        })();
    </script>
</body>
</html>
