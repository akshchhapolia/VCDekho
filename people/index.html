            <div class="inv-dir-sidebar-head">

                <span aria-hidden="true"></span>

            </div>

            <div class="inv-dir-field">
              <span>Thesis</span>
              <div class="inv-dd" id="filter-thesis" data-placeholder="All theses"></div>
            </div>

            <div class="inv-dir-field">
              <span>Ticket size</span>
              <div class="inv-dd" id="filter-cheque" data-placeholder="Any ticket"></div>
            </div>

            <button type="button" id="ppl-clear" class="inv-dir-clear">Clear filters</button>
          </aside>

          <div class="inv-dir-main">
            <div class="inv-dir-table-head" aria-hidden="true">

              <span>Firm</span>
              <span>Email</span>
              <span>Links</span>
            </div>
