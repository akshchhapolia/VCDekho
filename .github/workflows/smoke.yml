# Block broken SSR / missing imports before they reach production.
name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke
        env:
          # Optional: enables DB-backed profile extras in smoke (not required for pass/fail)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test
